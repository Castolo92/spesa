# Compila l'app Blazor e la pubblica su GitHub Pages a ogni push sul ramo main (o master).
name: Pubblica su GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # GitHub Pages pubblica in https://utente.github.io/nome-repository/
      # quindi il <base href> deve essere "/nome-repository/" (o "/" per un repository utente.github.io).
      - name: Imposta il percorso base
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then BASE="/"; else BASE="/$REPO/"; fi
          sed -i "s|<base href=\"/\" />|<base href=\"$BASE\" />|" wwwroot/index.html
          grep "<base" wwwroot/index.html

      - name: Compila
        run: dotnet publish SpesaCondivisa.csproj -c Release -o out

      - name: Prepara i file per GitHub Pages
        run: |
          cp out/wwwroot/index.html out/wwwroot/404.html
          touch out/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
