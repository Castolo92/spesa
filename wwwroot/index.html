<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Spesa</title>
    <!-- Su GitHub Pages il workflow sostituisce "/" con "/nome-repository/" -->
    <base href="/" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Spesa" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#2f7d4f" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        Si è verificato un errore.
        <a href="." class="reload">Ricarica</a>
        <span class="dismiss">🗙</span>
    </div>
    <script>
        window.spesa = {
            // Usa il pannello "Condividi" di iPhone; se non c'è, copia il link negli appunti.
            condividi: async (titolo, testo, url) => {
                try {
                    if (navigator.share) {
                        await navigator.share({ title: titolo, text: testo, url: url });
                        return "condiviso";
                    }
                } catch (e) {
                    if (e && e.name === "AbortError") return "annullato";
                }
                try {
                    await navigator.clipboard.writeText(testo + "\n" + url);
                    return "copiato";
                } catch {
                    window.prompt("Copia questo link:", url);
                    return "mostrato";
                }
            }
        };
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
